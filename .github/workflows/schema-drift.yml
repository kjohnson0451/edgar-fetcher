name: schema-drift
on: [pull_request, push]
jobs:
  check-schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Fetch schema
        run: make fetch-schema
      - name: Install go-jsonschema
        run: |
          make install-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate into temp location
        run: |
          mkdir -p /tmp/schema-check
          go-jsonschema -p main -t --capitalization CIK --capitalization XML \
            .schema/filing-envelope.schema.json \
            > /tmp/schema-check/filing_envelope_generated.go
      - name: Diff against committed file
        run: diff -u filing_envelope_generated.go /tmp/schema-check/filing_envelope_generated.go
