default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --verbose
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - revert
          - infra
          - chore
          - data
          - security
  - repo: local
    hooks:
      - id: check-generated-not-hand-edited
        name: Verify generated files match real generation output
        entry: scripts/check-generated.sh
        language: system
        files: '_generated\.go$'
        pass_filenames: false
        stages: [pre-commit]
